{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Loan Aid - Login</title>
    <link rel="icon" type="image/png" href="{% static 'img/Loan Aid.png' %}" />
    <!-- Custom fonts for this template-->
    <link href="{% static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Custom styles for this template-->
    <link href="{% static 'css/sb-admin-2.min.css' %}" rel="stylesheet" />
    <link href="{% static 'css/custom-styles.css' %}" rel="stylesheet" />
    <style>
      html, body { height: 100%; }
      body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff; }
      .container { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .card { max-width: 900px; width: 100%; }
      .login-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        margin: auto;
        padding: 2rem 0;
      }
      hr { border-top: 1px solid rgb(255 255 255 / 31%) !important; }
      .btn-primary { background-color: #69a3dd !important; color: rgb(0, 30, 71) !important; }
      .parent-container { display: grid; place-items: center; }
      .d-flex.logo { width: 12rem; height: 5.5rem; background-size: cover; background-position: center; }
      a, a:hover { color: #fff; }
    </style>
  </head>
  <body>
    <div class="container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
      <div class="row w-100 justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="col-xl-5 col-lg-6 col-md-8">
          <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-0">
              <div class="row align-items-center justify-content-center">
                <div class="col-12 bg-gradient-primary">
                  <div class="p-5">
                    <div class="parent-container">
                      <div class="d-flex logo" style="background-image: url('{% static 'img/Loan Aid.png' %}');"></div>
                    </div>
                    <hr />
                    <div class="text-center">
                      <h1 class="h4 text-white mb-4">Welcome Back!</h1>
                    </div>
                    <form class="user" method="POST">
                      {% csrf_token %}
                      {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                      {% endif %}

                      <div class="form-group">
                        <input type="text" class="form-control form-control-user" name="identifier" placeholder="Enter Username" required />
                      </div>
                      <div class="form-group" style="position: relative;">
                        <input type="password" class="form-control form-control-user" id="passwordInput" name="password" placeholder="Password" required />
                        <span id="togglePassword" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #6c757d;">
                          <i class="fas fa-eye"></i>
                        </span>
                      </div>
                      <button type="submit" class="btn btn-primary btn-user btn-block">Login</button>
                    </form>
                    <hr />
                    <div class="text-center">
                      {% comment %} <a class="small" href="{% url 'register' %}">Create an Account!</a> {% endcomment %}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Bootstrap core JavaScript-->
    <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <!-- Core plugin JavaScript-->
    <script src="{% static 'vendor/jquery-easing/jquery.easing.min.js' %}"></script>
    <!-- Custom scripts for all pages-->
    <script src="{% static 'js/sb-admin-2.min.js' %}"></script>
    <script>
      (function() {
        var input = document.getElementById('passwordInput');
        var toggle = document.getElementById('togglePassword');
        if (input && toggle) {
          toggle.addEventListener('click', function() {
            var isPassword = input.getAttribute('type') === 'password';
            input.setAttribute('type', isPassword ? 'text' : 'password');
            var icon = toggle.querySelector('i');
            if (icon) {
              if (isPassword) { icon.classList.remove('fa-eye'); icon.classList.add('fa-eye-slash'); }
              else { icon.classList.remove('fa-eye-slash'); icon.classList.add('fa-eye'); }
            }
          });
        }
      })();
    </script>
  </body>
</html>
