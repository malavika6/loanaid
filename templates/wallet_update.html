{% extends 'includes/base.html' %}

{% block content %}
<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card mt-4 shadow-sm">
        <div class="card-header d-flex align-items-center justify-content-between">
          <h5 class="mb-0">Update Wallet</h5>
          <a href="{% url 'wallet_manage' %}" class="btn btn-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> Back to Wallets
          </a>
        </div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Franchise</label>
              <select name="franchise" class="form-select" required>
                <option value="">Select Franchise</option>
                {% for f in franchises %}
                  <option value="{{ f.pk }}" {% if selected_franchise == f.pk %}selected{% endif %}>{{ f.franchise_name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="row g-3">
              <div class="col-12 col-md-4">
                <label class="form-label">Allowance</label>
                <input type="number" step="0.01" min="0" name="allowance" class="form-control" placeholder="Enter allowance amount" value="{{ current_allowance|default:'' }}">
                <small class="text-muted">Monthly allowance amount</small>
              </div>
              <div class="col-12 col-md-4">
                <label class="form-label">Commission</label>
                <input type="number" step="0.01" min="0" name="commission" class="form-control" placeholder="Enter commission amount" value="{{ current_commission|default:'' }}">
                <small class="text-muted">Commission amount</small>
              </div>
              <div class="col-12 col-md-4">
                <label class="form-label">Incentive</label>
                <input type="number" step="0.01" min="0" name="incentive" class="form-control" placeholder="Enter incentive amount" value="{{ current_incentive|default:'' }}">
                <small class="text-muted">Incentive amount</small>
              </div>
            </div>
            <div class="mt-4">
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i> Update Wallet
              </button>
              <a href="{% url 'wallet_manage' %}" class="btn btn-secondary ms-2">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
